plugins {
    id 'com.android.library'
}

android {
    compileSdk 32

    defaultConfig {
        minSdk 14
        targetSdk 32
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'com.mcal.androlib.util'
}

dependencies {
    implementation project(':core')
    implementation project(':androlib:brut.j.common')
    implementation misc.commons_io
}
