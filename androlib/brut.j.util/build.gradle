plugins {
    id 'com.android.library'
}

android {
    compileSdk project.targetSDK.toInteger()

    defaultConfig {
        minSdk project.minSDK.toInteger()
        targetSdk project.targetSDK.toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'com.mcal.androlib.util'
}

dependencies {
    implementation project(':core')
    implementation project(':androlib:brut.j.common')
    implementation misc.commons_io
}
