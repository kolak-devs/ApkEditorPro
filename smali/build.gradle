plugins {
    id 'com.android.library'
}

android {
    compileSdk project.targetSDK.toInteger()

    defaultConfig {
        minSdk project.minSDK.toInteger()
        targetSdk project.targetSDK.toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.mcal.smali'
}

dependencies {
    api files('libs/baksmali-2.5.2.jar')
    api files('libs/smali-2.5.2.jar')
    api files('libs/dexlib2-2.5.2.jar')
    api files('libs/util-2.5.2.jar')

    implementation misc.annotations
    implementation misc.annotations_android

    implementation misc.guava
}