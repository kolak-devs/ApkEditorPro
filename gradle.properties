# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Kotlin
kotlin.code.style=official

# Gradle Build Optimization
org.gradle.jvmargs=-Xms512m -Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseStringDeduplication -XX:ActiveProcessorCount=4
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
org.gradle.daemon.idletimeout=1800000

# Kotlin Daemon
kotlin.daemon.jvm.options=-Xms256m -Xmx1024m -XX:+UseParallelGC -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError

# R8 / ProGuard optimizations
android.enableR8.fullMode=true
android.enableR8.shrink=true
