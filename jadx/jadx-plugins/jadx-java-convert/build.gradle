plugins {
	id 'com.android.library'
}

android {
	compileSdk project.targetSDK.toInteger()

	defaultConfig {
		minSdk project.minSDK.toInteger()
		targetSdk project.targetSDK.toInteger()
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
		}
	}
	namespace 'com.mcal.jadx.jadx_plugin_java_convert'
}

dependencies {
	api(project(":jadx:jadx-plugins:jadx-plugins-api"))

	implementation(project(":jadx:jadx-plugins:jadx-dex-input"))
	implementation('com.jakewharton.android.repackaged:dalvik-dx:11.0.0_r3')
	implementation('com.android.tools:r8:3.3.75')

	implementation 'org.ow2.asm:asm:9.3'
	implementation 'org.slf4j:slf4j-api:2.0.3'
}
