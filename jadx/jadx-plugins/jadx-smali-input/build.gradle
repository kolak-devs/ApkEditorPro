plugins {
	id 'com.android.library'
}

android {
	compileSdk project.compileSDK.toInteger()

	defaultConfig {
		minSdk project.minSDK.toInteger()
		targetSdk project.targetSDK.toInteger()
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
		}
	}
	namespace 'com.mcal.jadx.jadx_plugin_smali_input'
}

dependencies {
	implementation("org.smali:dexlib2:2.5.2")
	implementation("org.smali:smali:2.5.2")
	implementation("org.smali:baksmali:2.5.2")

	api(project(":jadx:jadx-plugins:jadx-plugins-api"))
	implementation(project(":jadx:jadx-plugins:jadx-dex-input"))

	// force latest version for smali
	constraints {
		implementation 'com.google.guava:guava:31.1-android'
		implementation 'com.beust:jcommander:1.81'
	}

	implementation 'org.jetbrains:annotations:23.1.0'
	implementation 'org.slf4j:slf4j-api:2.0.3'
}
