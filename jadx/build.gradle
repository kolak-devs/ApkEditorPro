apply plugin: 'com.android.library'

android {
    compileSdkVersion 32

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 32
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        lintOptions {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':common')
    api project(':smali')
    implementation project(':libraries')

    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'androidx.annotation:annotation:1.3.0'

    // Plugins
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.beust:jcommander:1.81'
    implementation('com.jakewharton.android.repackaged:dalvik-dx:11.0.0_r3')
    implementation('com.android.tools:r8:3.1.51')
    implementation 'org.ow2.asm:asm:9.2'

    // Raung asm
    implementation 'info.picocli:picocli:4.6.3'
    api("org.ow2.asm:asm-util:9.2")

    // JaDX Core
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.android.tools.build:aapt2-proto:4.2.1-7147631'
    constraints {
        // Force protobuf version to prevent Java-7 issue
        implementation 'com.google.protobuf:protobuf-java:3.11.4'
    }
    testImplementation 'org.apache.commons:commons-lang3:3.12.0'
    testImplementation 'org.eclipse.jdt:ecj:3.28.0'
    testImplementation 'tools.profiler:async-profiler:1.8.3'

    // JaDX CLI
    implementation 'com.beust:jcommander:1.82'
    implementation 'ch.qos.logback:logback-classic:1.2.10'
}