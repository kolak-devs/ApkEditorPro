plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdkVersion 32

    defaultConfig {
        minSdk 26
        targetSdk 32
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        lintOptions {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.mcal.jadx.pro'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'org.jetbrains:annotations:23.0.0'

    //testImplementation 'ch.qos.logback:logback-classic:1.2.11'
    //testImplementation 'org.hamcrest:hamcrest-library:2.2'
    //testImplementation 'org.mockito:mockito-core:4.5.1'
    //testImplementation 'org.assertj:assertj-core:3.22.0'

    //testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    //testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'

    //testCompileOnly 'org.jetbrains:annotations:23.0.0'

    implementation project(':common')
    api project(':smali')
    //api project(':raung')
    implementation project(':libraries')

    implementation "androidx.core:core-ktx:1.7.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.1'

    // jadx-core
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.android.tools.build:aapt2-proto:4.2.1-7147631'
    constraints {
        // Force protobuf version to prevent Java-7 issue
        implementation 'com.google.protobuf:protobuf-java:3.11.4'
    }

    testImplementation 'org.apache.commons:commons-lang3:3.12.0'

    testImplementation 'org.eclipse.jdt:ecj:3.29.0'
    testImplementation 'tools.profiler:async-profiler:1.8.3'

    // jadx-dex-input
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.beust:jcommander:1.81'

    // jadx-java-convert
    implementation('com.jakewharton.android.repackaged:dalvik-dx:11.0.0_r3')
    implementation('com.android.tools:r8:3.3.28')

    implementation 'org.ow2.asm:asm:9.3'

    // show bytecode disassemble
    implementation 'io.github.skylot:raung-disasm:0.0.2'

    // jadx-raung-input
    implementation('io.github.skylot:raung-asm:0.0.2')

    // jadx-smali-input
    implementation 'com.google.guava:guava:30.1.1-jre'
    implementation 'com.beust:jcommander:1.81'
}