plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk project.compileSDK.toInteger()

    defaultConfig {
        minSdk project.minSDK.toInteger()
        targetSdk project.targetSDK.toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'com.mcal.appdm.base'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets {
        main {
            java.srcDirs += [
                    file('../sqliteutil/src/main/java'),
                    file('../imageview/src/main/java'),
                    file('../patchview/src/main/java'),
                    file('../manifestparser/src/main/java'),
                    file('../net-manager/src/main/java'),
                    file('../bsh-engine/src/main/java')
            ]
            res.srcDirs += [
                    file('../sqliteutil/src/main/res'),
                    file('../imageview/src/main/res'),
                    file('../patchview/src/main/res'),
                    file('../net-manager/src/main/res'),
                    file('../bsh-engine/src/main/res')
            ]
            assets.srcDirs += [
                    file('../bsh-engine/src/main/assets')
            ]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

dependencies {
    implementation project(':core')
    api project(':feature:code-editor')
    implementation files('../../libraries/jadx-core.jar')

    implementation("androidx.appcompat:appcompat:1.6.1")

    implementation("com.google.android.material:material:1.11.0")

    implementation("org.jetbrains:annotations:24.0.1")

    // sqliteutil deps (covered above)

    // imageview deps
    implementation("com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0")

    // patchview deps
    implementation fileTree(dir: '../patchview/libs', include: ['*.jar'])
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.core:core-ktx:1.12.0"
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // manifestparser deps
    implementation("com.google.guava:guava:31.0.1-android")
    implementation("androidx.annotation:annotation:1.7.1")

    // net-manager deps
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")

    // bsh-engine deps
    implementation fileTree(dir: '../bsh-engine/libs', include: ['*.jar'])
    implementation("com.github.TimScriptov.App-UI-Designer:webview:1.0.9")
    implementation("com.github.TimScriptov:Android-ApkTool-Library:2.7.0.8")
    implementation("com.android.tools.smali:smali-baksmali:3.0.10")
    implementation("com.android.tools.smali:smali-dexlib2:3.0.10")
    implementation("com.android.tools.smali:smali:3.0.10")
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("com.mikepenz:fastadapter:5.7.0")
    implementation("com.mikepenz:fastadapter-extensions-binding:5.7.0")
    implementation("me.zhanghai.android.fastscroll:library:1.3.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")
}