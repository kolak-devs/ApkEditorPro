plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk project.compileSDK.toInteger()

    defaultConfig {
        minSdk project.minSDK.toInteger()
        targetSdk project.targetSDK.toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    packagingOptions {
        resources.excludes += 'license/*'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'com.mcal.neweditor'
}

dependencies {
    implementation project(':core')
    implementation project(':jadx:jadx-core')
    implementation project(':jadx:jadx-plugins:jadx-dex-input')
    implementation project(':jadx:jadx-plugins:jadx-smali-input')
    implementation project(':melissa')
    implementation project(':feature:colormixer')
    implementation project(':feature:permission-editor')
    implementation project(':feature:ui-designer')
    implementation misc.guava

    implementation tools.dexlib2
    implementation tools.smali
    implementation tools.baksmali

    implementation jetpack.appcompat
    implementation jetpack.lifecycle

    implementation jetpack.material

    implementation misc.coroutines_core

//    implementation 'io.github.Rosemoe.sora-editor:editor-kt:0.15.0-dev-1'
    implementation rosemoe.editor
    implementation rosemoe.language_java
    implementation rosemoe.textmate
    implementation rosemoe.lsp
}