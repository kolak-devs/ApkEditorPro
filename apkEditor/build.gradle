plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 32
    ndkVersion '23.1.7779620'
    
    defaultConfig {
        applicationId "com.mcal.apkeditor"
        minSdk 14
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
        versionCode 1126
        versionName "1.12.6"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            version '3.18.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // Specifies one flavor dimension.
    flavorDimensions "version"
    //defaultVariant = "pro"
    productFlavors {
        // TODO: Deprecated legacy-version
        legacy {
            // Assigns this product flavor to the "version" flavor dimension.
            // If you are using only one dimension, this property is optional,
            // and the plugin automatically assigns all the module's flavors to
            // that dimension.
            dimension "version"
            minSdkVersion 14
            versionNameSuffix "-minApi14"
            applicationIdSuffix ".legacy"

            buildConfigField "String", "JADX_VERSION", "\"legacy\""
            buildConfigField "String", "APKTOOL_VERSION", "\"2.4.0\""
            buildConfigField "String", "SMALI_VERSION", "\"legacy\""

            dependencies {
                legacyApi project(':androlib-legacy')
                legacyApi project(':jadx-legacy')
                legacyApi project(':smali-legacy')
            }
        }
        pro {
            dimension "version"
            minSdkVersion 26
            versionNameSuffix "-minApi26"
            applicationIdSuffix ".pro"

            buildConfigField "String", "JADX_VERSION", "\"1.3.5+\""
            buildConfigField "String", "APKTOOL_VERSION", "\"2.6.1+\""
            buildConfigField "String", "SMALI_VERSION", "\"2.5.2\""
            
            getIsDefault().set(true)
            dependencies {
                proApi project(':androlib')
                proApi project(':jadx')
                proApi project(':smali')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField "boolean", "IS_PRO", "true"
            buildConfigField "boolean", "WITH_SIGN", "true"
            buildConfigField "boolean", "DISPLAY_APP", "true"
            buildConfigField "boolean", "ODEX_PATCH", "true"
            buildConfigField "boolean", "SHOW_AGREEMENT", "true"
            buildConfigField "boolean", "LIMIT_NEW_VERSION", "true"
            buildConfigField "boolean", "PARSER_ONLY", "false"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            buildConfigField "boolean", "IS_PRO", "true"
            buildConfigField "boolean", "WITH_SIGN", "true"
            buildConfigField "boolean", "DISPLAY_APP", "true"
            buildConfigField "boolean", "ODEX_PATCH", "true"
            buildConfigField "boolean", "SHOW_AGREEMENT", "true"
            buildConfigField "boolean", "LIMIT_NEW_VERSION", "true"
            buildConfigField "boolean", "PARSER_ONLY", "false"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${variant.name}-${variant.versionName}.apk"
        }
    }


    compileOptions {
        // Flag to enable support for the new language APIs
        //coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
//        resources.excludes += 'api_database/*'
//        resources.excludes += 'com/android/tools/r8/*'
//        resources.excludes += 'export/*'
//        resources.excludes += 'google/protobuf/*'
//        resources.excludes += 'junit/*'
        resources.excludes += 'keys/*'
//        resources.excludes += 'kotlin/*'
//        resources.excludes += 'org/conscrypt/*'
//        resources.excludes += 'properties/*'
//        resources.excludes += 'androidsupportmultidexversion.txt'
//        resources.excludes += 'baksmali.properties'
//        resources.excludes += 'configuration.proto'
//        resources.excludes += 'kotlin-tooling-metadata.json'
//        resources.excludes += 'LICENSE-junit.txt'
//        resources.excludes += 'logback.xml'
//        resources.excludes += 'Resources.proto'
//        resources.excludes += 'ResourcesInternal.proto'
//        resources.excludes += 'Configuration.proto'
//        resources.excludes += 'DebugProbesKt.bin'
//        resources.excludes += 'smali.properties'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.mcal.apkeditor'
}

configurations {
    proApi
    legacyApi
}

dependencies {
    implementation project(':apklib')
    implementation project(':common')
    implementation project(':codeeditor')
    implementation project(':httpserver')
    implementation project(':pngeditor')
    implementation project(':imageview')
    implementation project(':apksigner')
    implementation project(':dataeditor')
    implementation project(':crashreporter')
    implementation project(':patchview')
    implementation project(':so-translator')
    implementation project(':color-picker')

    implementation project(':libraries')

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'

    implementation 'com.google.android.material:material:1.6.0'

    implementation 'org.jetbrains:annotations:23.0.0'

    implementation 'com.google.guava:guava:31.1-android'
    implementation 'org.antlr:antlr-runtime:3.5.2'

    //coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
}