import com.android.build.api.artifact.SingleArtifact
import com.android.build.api.variant.BuiltArtifactsLoader
import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

import java.nio.file.Files
import java.nio.file.StandardCopyOption

abstract class RenameApkTask extends DefaultTask {

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInputDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Internal
    abstract Property<BuiltArtifactsLoader> getBuiltArtifactsLoader()

    @Input
    abstract Property<String> getVariantName()

    @Input
    abstract Property<Integer> getMinSdkVersion()

    @TaskAction
    void renameApk() {
        File outDir = outputDir.get().asFile
        if (outDir.exists()) {
            outDir.deleteDir()
        }
        outDir.mkdirs()

        def artifacts = builtArtifactsLoader.get().load(inputDir.get())
        if (artifacts == null) {
            throw new RuntimeException('Cannot load generated APKs')
        }

        artifacts.elements.each { builtArtifact ->
            String newName
            if (variantName.get() == 'release') {
                newName = "Apk Editor v.${builtArtifact.versionName}-Min API ${minSdkVersion.get()}.apk"
            } else {
                newName = "${variantName.get()}-${builtArtifact.versionName}-milestone-(${builtArtifact.versionCode}).apk"
            }
            Files.copy(
                    new File(builtArtifact.outputFile).toPath(),
                    new File(outDir, newName).toPath(),
                    StandardCopyOption.REPLACE_EXISTING
            )
        }
        artifacts.save(outputDir.get())
    }
}

