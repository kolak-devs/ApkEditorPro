androidComponents {
    onVariants(selector().all()) { variant ->
        def renameTask = tasks.register("renameApkFor${variant.name.capitalize()}", RenameApkTask) {
            it.outputDir.set(layout.buildDirectory.dir("outputs/renamed_apks/${variant.name}"))
            it.builtArtifactsLoader.set(variant.artifacts.getBuiltArtifactsLoader())
            it.variantName.set(variant.name)
            it.minSdkVersion.set(project.minSDK.toInteger())
        }
        variant.artifacts.use(renameTask).wiredWith { task -> task.inputDir }.toListenTo(SingleArtifact.APK.INSTANCE)
    }
}

