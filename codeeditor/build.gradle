plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 32

    defaultConfig {
        minSdk 14
        targetSdk 32
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    packagingOptions {
        resources.excludes += 'license/*'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'com.mcal.neweditor'
}

dependencies {
    implementation project(':common')
    implementation project(':jadx')

    implementation 'androidx.appcompat:appcompat:1.4.2'

    implementation 'com.google.android.material:material:1.6.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.1'

    implementation 'io.github.Rosemoe.sora-editor:editor-kt:0.11.4'
    implementation 'io.github.Rosemoe.sora-editor:editor:0.11.4'
    implementation 'io.github.Rosemoe.sora-editor:language-java:0.11.4'
    implementation 'io.github.Rosemoe.sora-editor:language-textmate:0.11.4'
}